name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: "Build & upload the full Windows x64 desktop package (~30 min)"
        type: boolean
        default: false
      package_linux:
        description: "Build & upload every Linux x64 artifact: REH server, REH-web (browser workbench) and the desktop .deb (~40 min)"
        type: boolean
        default: false
      release:
        description: "Publish artifacts to a GitHub Release (requires package and/or package_linux)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Silence the "Node.js 20 actions are deprecated" warnings on every job by
  # opting all third-party JS actions (checkout, cache, setup-node, setup-python)
  # into the Node 24 runtime ahead of GitHub's June 2026 default flip.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bump-version:
    name: Bump patch version
    # Only auto-bump on push to main. Skip if the head commit is itself the
    # bump commit (avoids an infinite loop).
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version + tag
        id: bump
        run: |
          new_version=$(node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const [maj, min, patch] = pkg.version.split('.').map(Number);
            pkg.version = [maj, min, patch + 1].join('.');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log(pkg.version);
          ")
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          git add package.json
          git commit -m "chore(release): v${new_version} [skip ci]"
          git tag -a "v${new_version}" -m "Release v${new_version}"
          git push origin HEAD:main
          git push origin "v${new_version}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  compile:
    name: Compile (PR fast-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR-only fast-fail: the package jobs do their own compile, so on push-to-main
    # this job is pure waste. Runs on Linux rather than Windows — the check is
    # platform-independent and Linux runners start faster.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            build/vite/package-lock.json
            extensions/**/package-lock.json
            remote/**/package-lock.json
            test/**/package-lock.json
            .vscode/extensions/**/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache node_modules (root + build only, for type-check)
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
          key: nm-typecheck-${{ runner.os }}-x64-${{ hashFiles('package-lock.json', 'build/package-lock.json', '.nvmrc') }}

      - name: Install root + build deps only (skip recursive postinstall)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          npm --prefix build ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Type-check (tsgo, fast)
        run: npm run compile-check-ts-native

      - name: Validate layers
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run valid-layers-check

  package-windows:
    name: Package Windows x64
    # Run on every push to main (after bump) and on opt-in workflow_dispatch.
    if: |
      always() &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.package)
      )
    needs: [bump-version]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      # Belt-and-braces: `vscode-win32-x64-min` takes the esbuild path (see
      # build/buildConfig.ts), which never invokes the TS->TS mangler. This only
      # matters if that path is ever switched back off.
      VSCODE_NO_MANGLE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            build/vite/package-lock.json
            extensions/**/package-lock.json
            remote/**/package-lock.json
            test/**/package-lock.json
            .vscode/extensions/**/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
            build/vite/node_modules
            extensions/node_modules
            extensions/*/node_modules
            extensions/*/server/node_modules
            remote/node_modules
            remote/web/node_modules
            test/*/node_modules
            .vscode/extensions/*/node_modules
          key: nm-${{ runner.os }}-x64-${{ hashFiles('package-lock.json', 'build/package-lock.json', 'build/vite/package-lock.json', 'extensions/**/package-lock.json', 'remote/**/package-lock.json', 'test/**/package-lock.json', '.vscode/extensions/**/package-lock.json', 'build/npm/dirs.ts', '.nvmrc') }}

      # The node-gyp that npm bundles (11.2.0 for the Node in .nvmrc) cannot
      # identify the Visual Studio on the current windows-latest image: its
      # PowerShell probe overflows node-gyp's stdio buffer
      # (ERR_CHILD_PROCESS_STDIO_MAXBUFFER), and the directory fallback then
      # reports `unknown version "undefined" found at ...\Microsoft Visual
      # Studio\18\Enterprise` and gives up. Every native module
      # (@vscode/deviceid, native-watchdog, spdlog, sqlite3 …) fails to build.
      #
      # VS 2026 (v18) support landed in node-gyp 12.1.0, so the fix is to get a
      # newer node-gyp in front of npm. Installing node-gyp globally and
      # exporting npm_config_node_gyp does NOT work: npm's run-script overwrites
      # npm_config_node_gyp with its own bundled copy for every lifecycle
      # script, so the global install is silently ignored (that is why the build
      # still reported `using node-gyp@11.2.0` after that was tried). Upgrading
      # npm itself is what actually replaces the node-gyp that gets used.
      #
      # npm 11 (currently 11.19.0, bundling node-gyp ^12.4.0) is the newest line
      # whose engines still accept the Node in .nvmrc — npm 12 requires
      # Node >=22.22.2. Left floating on the 11.x line so the bundled node-gyp
      # keeps up with future Visual Studio releases without pinning the image.
      - name: Use an npm whose bundled node-gyp knows this Visual Studio
        shell: bash
        run: |
          npm install -g npm@11
          npm --version
          node "$(npm root -g)/npm/node_modules/node-gyp/bin/node-gyp.js" --version

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          npm_config_prefer_offline: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_jobs: "max"
          # Lifts GitHub anonymous API rate limit (60/hr/IP) to the
          # authenticated 5000/hr quota — required for @vscode/ripgrep's
          # postinstall, which 403s otherwise.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Electron and built-in extensions
        uses: actions/cache@v4
        with:
          path: |
            .build/electron
            .build/builtInExtensions
          key: build-deps-${{ runner.os }}-x64-${{ hashFiles('.npmrc', 'product.json', 'cgmanifest.json') }}
          restore-keys: |
            build-deps-${{ runner.os }}-x64-

      - name: Download Electron and built-in extensions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node build/lib/electron.ts
          node build/lib/builtInExtensions.ts

      - name: Build app (vscode-win32-x64-min)
        run: npm run gulp vscode-win32-x64-min

      - name: Copy inno_updater.exe + vcruntime140.dll into the app's tools folder
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Build installer (vscode-win32-x64-user-setup)
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage build outputs into the repo (for upload-artifact)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .build/upload | Out-Null
          $appSrc = Resolve-Path ../VSCode-win32-x64
          Copy-Item -Recurse -Force $appSrc .build/upload/VSCode-win32-x64
          # Rename installer to a stable, version-pinned name for releases
          $installer = Get-ChildItem .build/win32-x64/user-setup/*.exe | Select-Object -First 1
          $stable = "oterminal-${{ steps.ver.outputs.version }}-win32-x64-user-setup.exe"
          Copy-Item -Force $installer.FullName ".build/upload/$stable"

      - name: Upload unzipped OTerminal app
        uses: actions/upload-artifact@v4
        with:
          name: oterminal-win32-x64
          path: .build/upload/VSCode-win32-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: oterminal-win32-x64-user-setup
          path: .build/upload/oterminal-*-win32-x64-user-setup.exe
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package Linux x64 (REH + REH-web + desktop .deb)
    if: |
      always() &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.package_linux)
      )
    needs: [bump-version]
    runs-on: ubuntu-latest
    # All three Linux artifacts are produced from ONE compile. Previously this
    # was two jobs that each ran a full independent compile of the same sources.
    timeout-minutes: 90
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      # `core-ci` takes the esbuild path (build/buildConfig.ts), which never runs
      # the TS->TS mangler. Kept as a guard in case that path is switched off.
      VSCODE_NO_MANGLE: "1"
      # Match heap to actual runner RAM; the default `npm run gulp` script asks
      # for 8192 which exceeds physical memory on ubuntu-latest (~7GB).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}

      - name: Add 4 GB swap (headroom for the esbuild + extension webpack passes)
        run: |
          sudo fallocate -l 4G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            build/vite/package-lock.json
            extensions/**/package-lock.json
            remote/**/package-lock.json
            test/**/package-lock.json
            .vscode/extensions/**/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build deps (incl. dpkg + fakeroot for .deb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbfile-dev libsecret-1-dev libkrb5-dev libx11-dev \
            libxkbcommon-dev fakeroot rpm dpkg-dev

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            build/node_modules
            build/vite/node_modules
            extensions/node_modules
            extensions/*/node_modules
            extensions/*/server/node_modules
            remote/node_modules
            remote/web/node_modules
            test/*/node_modules
            .vscode/extensions/*/node_modules
          key: nm-${{ runner.os }}-x64-${{ hashFiles('package-lock.json', 'build/package-lock.json', 'build/vite/package-lock.json', 'extensions/**/package-lock.json', 'remote/**/package-lock.json', 'test/**/package-lock.json', '.vscode/extensions/**/package-lock.json', 'build/npm/dirs.ts', '.nvmrc') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          npm_config_prefer_offline: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_jobs: "max"
          # Lifts GitHub anonymous API rate limit (60/hr/IP) to the
          # authenticated 5000/hr quota — required for @vscode/ripgrep's
          # postinstall, which 403s otherwise.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Electron and built-in extensions
        uses: actions/cache@v4
        with:
          path: |
            .build/electron
            .build/builtInExtensions
          key: build-deps-linux-x64-${{ hashFiles('.npmrc', 'product.json', 'cgmanifest.json') }}
          restore-keys: |
            build-deps-linux-x64-

      - name: Download Electron and built-in extensions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node build/lib/electron.ts
          node build/lib/builtInExtensions.ts

      # ONE compile for all three artifacts. `core-ci` transpiles + type-checks
      # once with esbuild/tsgo, compiles the non-native extensions, then emits
      # all three shipping bundles in parallel:
      #   out-vscode-min           -> Linux desktop app / .deb
      #   out-vscode-reh-min       -> REH server (Remote-SSH)
      #   out-vscode-reh-web-min   -> REH-web server (browser workbench)
      # The `*-min-ci` packaging tasks below consume those folders and do NOT
      # recompile; they only add the native extensions and package.
      - name: Compile core (esbuild — desktop + REH + REH-web bundles)
        run: npm run gulp core-ci

      - name: Package REH server (vscode-reh-linux-x64-min-ci)
        run: npm run gulp vscode-reh-linux-x64-min-ci

      # `reh-web` is the same server plus the web workbench assets; it is what
      # serves the editor UI over HTTP and what OTHCloud embeds in a website's
      # Editor tab. The plain `reh` build answers the remote-SSH protocol only
      # and 404s every HTTP path.
      - name: Package web server (vscode-reh-web-linux-x64-min-ci)
        run: npm run gulp vscode-reh-web-linux-x64-min-ci

      - name: Package desktop app (vscode-linux-x64-min-ci)
        run: npm run gulp vscode-linux-x64-min-ci

      - name: Build .deb package
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Stage REH server output (gulp emits it to ../vscode-reh-linux-x64)
        run: |
          mkdir -p .build/upload
          cp -r ../vscode-reh-linux-x64 .build/upload/vscode-reh-linux-x64
          # Stable filename pattern consumed by product.json's serverDownloadUrlTemplate
          tar -czf ".build/upload/othcloud-terminal-server-linux-x64-${{ steps.ver.outputs.version }}.tar.gz" \
            -C .build/upload/vscode-reh-linux-x64 .

      - name: Stage web server output (gulp emits it to ../vscode-reh-web-linux-x64)
        run: |
          cp -r ../vscode-reh-web-linux-x64 .build/upload/vscode-reh-web-linux-x64
          tar -czf ".build/upload/othcloud-terminal-server-web-linux-x64-${{ steps.ver.outputs.version }}.tar.gz" \
            -C .build/upload/vscode-reh-web-linux-x64 .

      - name: Stage desktop outputs (rename .deb to a stable, version-pinned name)
        run: |
          # Locate the produced .deb (gulp emits it under .build/linux/deb/<arch>/deb/)
          deb_src=$(find .build/linux/deb -name '*.deb' -print -quit)
          if [ -z "$deb_src" ]; then
            echo "No .deb file produced!" >&2
            exit 1
          fi
          cp "$deb_src" ".build/upload/oterminal_${{ steps.ver.outputs.version }}_amd64.deb"
          cp -r ../VSCode-linux-x64 .build/upload/VSCode-linux-x64
          ls -la .build/upload

      - name: Upload Linux REH server (raw folder)
        uses: actions/upload-artifact@v4
        with:
          name: othcloud-terminal-server-linux-x64
          path: .build/upload/vscode-reh-linux-x64
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux REH server (.tar.gz for remote-SSH)
        uses: actions/upload-artifact@v4
        with:
          name: othcloud-terminal-server-linux-x64-${{ steps.ver.outputs.version }}.tar.gz
          path: .build/upload/othcloud-terminal-server-linux-x64-${{ steps.ver.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux web server (.tar.gz for browser workbench)
        uses: actions/upload-artifact@v4
        with:
          name: othcloud-terminal-server-web-linux-x64-${{ steps.ver.outputs.version }}.tar.gz
          path: .build/upload/othcloud-terminal-server-web-linux-x64-${{ steps.ver.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux desktop app (raw folder)
        uses: actions/upload-artifact@v4
        with:
          name: oterminal-linux-x64
          path: .build/upload/VSCode-linux-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux .deb installer
        uses: actions/upload-artifact@v4
        with:
          name: oterminal-linux-x64-deb
          path: .build/upload/oterminal_*_amd64.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [bump-version, package-windows, package-linux]
    # Publish whatever built. Requiring every platform meant a Windows
    # toolchain problem threw away a completed Linux build and published
    # nothing at all — the version had already been bumped, so the artifacts
    # existed, were correct, and were unreachable to everyone but whoever
    # thought to dig them out of the run. The per-platform downloads below are
    # individually optional; a release simply contains the platforms that
    # succeeded, and the notes list exactly those.
    #
    # `package-linux` now produces the REH server, the REH-web server and the
    # .deb from one compile, so it is the single required job; Windows stays
    # optional.
    if: |
      always() &&
      needs.bump-version.result == 'success' &&
      needs.package-linux.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.release)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: oterminal-win32-x64-user-setup
          path: ./release-assets
        continue-on-error: true

      - name: Download Linux REH tarball (for SSH)
        uses: actions/download-artifact@v4
        with:
          name: othcloud-terminal-server-linux-x64-${{ needs.bump-version.outputs.version }}.tar.gz
          path: ./release-assets

      - name: Download Linux web server tarball (browser workbench)
        uses: actions/download-artifact@v4
        with:
          name: othcloud-terminal-server-web-linux-x64-${{ needs.bump-version.outputs.version }}.tar.gz
          path: ./release-assets

      - name: Download Linux desktop .deb
        uses: actions/download-artifact@v4
        with:
          name: oterminal-linux-x64-deb
          path: ./release-assets
        continue-on-error: true

      - name: List release assets
        run: ls -la ./release-assets

      # Built from what is actually on disk, not from a fixed list. A
      # hardcoded list outlives the build that was supposed to produce it and
      # ends up advertising downloads that 404.
      - name: Describe what built
        id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "Automated release built from commit ${{ needs.bump-version.outputs.sha }}."
            echo
            echo "## Downloads"
            cd ./release-assets
            for f in *; do
              case "$f" in
                *win32-x64-user-setup.exe) label="Windows desktop installer" ;;
                *_amd64.deb)               label="Linux desktop (.deb)" ;;
                *server-web-linux-x64-*)   label="Linux web server (browser workbench, used by OTHCloud)" ;;
                *server-linux-x64-*)       label="Linux remote server (used by Remote-SSH)" ;;
                *)                         label="$f" ;;
              esac
              echo "- **$label:** \`$f\`"
            done
            cd ..
            for want in "win32-x64-user-setup.exe:Windows desktop installer" "_amd64.deb:Linux desktop (.deb)"; do
              pat="${want%%:*}"; label="${want#*:}"
              ls ./release-assets | grep -q -- "$pat" || echo "- _$label did not build for this release._"
            done
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.bump-version.outputs.tag }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "OTerminal ${{ needs.bump-version.outputs.version }}" \
            --notes "${{ steps.notes.outputs.body }}" \
            ./release-assets/*
